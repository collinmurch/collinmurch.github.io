<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260">
	<style>
		.label {
			fill: currentColor;
			font: 600 13px var(--font-sans, sans-serif);
			letter-spacing: 0.08em;
		}
		.muted {
			fill: var(--color-muted-foreground, currentColor);
			font-weight: 400;
		}
		.grid {
			stroke: var(--color-border, currentColor);
			stroke-dasharray: 2 6;
		}
	</style>
	<defs>
		<linearGradient id="swell" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="var(--color-accent, #cde8e5)" stop-opacity="0.55" />
			<stop offset="1" stop-color="var(--color-accent, #cde8e5)" stop-opacity="0" />
		</linearGradient>
		<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="var(--color-primary, #ad6600)" />
			<stop offset="1" stop-color="var(--color-primary, #ad6600)" stop-opacity="0" />
		</radialGradient>
	</defs>
	<line class="grid" x1="40" y1="70" x2="600" y2="70" />
	<line class="grid" x1="40" y1="130" x2="600" y2="130" />
	<line class="grid" x1="40" y1="190" x2="600" y2="190" />
	<circle cx="520" cy="58" r="34" fill="url(#sun)" />
	<path
		d="M40 130 C 110 60, 180 60, 250 130 S 390 200, 460 130 S 560 60, 600 95 L 600 230 L 40 230 Z"
		fill="url(#swell)"
	/>
	<path
		d="M40 130 C 110 60, 180 60, 250 130 S 390 200, 460 130 S 560 60, 600 95"
		fill="none"
		stroke="var(--color-accent, #cde8e5)"
		stroke-width="2.5"
		stroke-linecap="round"
	/>
	<path
		d="M40 150 C 120 105, 190 110, 260 150 S 400 195, 470 150 S 565 110, 600 125"
		fill="none"
		stroke="currentColor"
		stroke-opacity="0.35"
		stroke-width="1.5"
		stroke-dasharray="6 6"
	/>
	<circle cx="145" cy="78" r="4" fill="var(--color-primary, #ad6600)" />
	<circle cx="355" cy="182" r="4" fill="var(--color-primary, #ad6600)" />
	<text class="label" x="145" y="52" text-anchor="middle">HIGH TIDE</text>
	<text class="label" x="355" y="218" text-anchor="middle">LOW TIDE</text>
	<text class="label muted" x="40" y="252">06:00</text>
	<text class="label muted" x="600" y="252" text-anchor="end">18:00</text>
</svg>
