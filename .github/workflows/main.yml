name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  repository_dispatch:
    types: [recipes-updated]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format

      - name: Test
        run: bun run test

      # A dispatch from the recipes repo names the bundle commit to render.
      # Pushes here and manual runs take the tip of the bundle branch, so a
      # site change never deploys stale or missing recipes.
      - name: Fetch recipes
        uses: actions/checkout@v4
        with:
          repository: collinmurch/recipes
          ref: ${{ github.event.client_payload.sha || 'bundle' }}
          token: ${{ secrets.SITE_TOKEN }}
          persist-credentials: false
          path: recipes-data

      - name: Check recipes
        run: test -f recipes-data/index.json

      - name: Build
        run: bun run build

      - name: Bundle budgets
        run: bun run budget

      - name: Create .nojekyll
        run: touch build/.nojekyll

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build/"

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
